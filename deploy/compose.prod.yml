# Production single-host stand-up for Jackline (default topology).
#
# Prefer pulling published GHCR images (fast path):
#   cp deploy/.env.prod.example .env.prod
#   # set secrets + POSTGRES_PASSWORD (or DATABASE_URL)
#   docker compose -f deploy/compose.prod.yml -f deploy/compose.postgres.yml \
#     --env-file .env.prod pull
#   docker compose -f deploy/compose.prod.yml -f deploy/compose.postgres.yml \
#     --env-file .env.prod up -d
#
# Build from source instead (no registry):
#   docker compose ... up --build -d
#
# Override images for a private registry / mirror via JACKLINE_*_IMAGE in .env.prod.
#
# BYO / managed Postgres: omit compose.postgres.yml and set DATABASE_URL
# (GCP Pulumi + Cloud SQL is one recipe — see deploy/pulumi/README.md).
#
# Live VM updates: use deploy/scripts/remote-deploy.sh (not `up --build -d`).
#
# HTTPS: set JACKLINE_SITE_ADDRESS / JACKLINE_DOCS_SITE_ADDRESS to bare hostnames
# (no http://) and open ports 80 + 443. See apps/docs/pages/self-hosting.mdx.
#
# Dev / try-it stack: deploy/docker-compose.yml + Dockerfile.dev

name: jackline

services:
  migrate:
    image: ${JACKLINE_MIGRATE_IMAGE:-ghcr.io/kvpendergast/jackline-migrate:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrate
    env_file:
      - ../.env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: "no"

  api:
    image: ${JACKLINE_API_IMAGE:-ghcr.io/kvpendergast/jackline-api:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    env_file:
      - ../.env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_HOST: 0.0.0.0
      API_PORT: 8080
      NODE_ENV: production
      JACKLINE_INTERNAL_MCP_URL: http://gateway:8081/mcp
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  gateway:
    image: ${JACKLINE_GATEWAY_IMAGE:-ghcr.io/kvpendergast/jackline-gateway:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: gateway
    env_file:
      - ../.env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8081
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    image: ${JACKLINE_WEB_IMAGE:-ghcr.io/kvpendergast/jackline-web:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  docs:
    image: ${JACKLINE_DOCS_IMAGE:-ghcr.io/kvpendergast/jackline-docs:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: docs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  caddy:
    image: caddy:2.9-alpine
    ports:
      - "${JACKLINE_HTTP_PORT:-80}:80"
      - "${JACKLINE_HTTPS_PORT:-443}:443"
    environment:
      JACKLINE_SITE_ADDRESS: ${JACKLINE_SITE_ADDRESS:-http://localhost}
      JACKLINE_DOCS_SITE_ADDRESS: ${JACKLINE_DOCS_SITE_ADDRESS:-http://docs.localhost}
      JACKLINE_CADDY_GLOBAL_OPTIONS: ${JACKLINE_CADDY_GLOBAL_OPTIONS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - gateway
      - web
      - docs
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
