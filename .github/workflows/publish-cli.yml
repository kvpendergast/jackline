# Publish @buildstuff/jackline to npm via OIDC trusted publishing (no long-lived NPM_TOKEN).
#
# Prerequisites (npm-side; CI cannot create these):
# 1. Create the npm org "buildstuff" if needed.
# 2. Bootstrap the package once (trusted publisher requires an existing package record):
#      cd apps/cli && npm login && npm publish --access public --ignore-scripts --provenance=false
# 3. On https://www.npmjs.com/package/@buildstuff/jackline → Settings / Access → Trusted Publisher:
#      Organization/user: kvpendergast
#      Repository:        jackline
#      Workflow filename: publish-cli.yml   (filename only, with .yml)
#      Environment:       (leave empty unless the job sets `environment:`)
#      Allowed action:    npm publish
# 4. Revoke any temporary publish tokens after OIDC works.
#
# Notes:
# - Provenance is off while the GitHub repo is private (npm requires a public repo for provenance).
# - ENEEDAUTH from this workflow almost always means step 3 is missing or mismatched.
#
# Release: bump apps/cli version, commit, then:
#   git tag cli-vX.Y.Z && git push origin cli-vX.Y.Z
name: Publish CLI

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Prefer package.json "packageManager" (pnpm@10.33.3); do not also set version here.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Do not set registry-url — setup-node would write an .npmrc that can block OIDC.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          # Release builds should not reuse install caches.
          cache: ""

      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        run: |
          npm install -g npm@latest
          node -v
          npm -v

      - name: Verify release tag matches package.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#cli-v}"
          PKG="$(node -p "require('./apps/cli/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag cli-v${TAG} does not match apps/cli version ${PKG}"
            exit 1
          fi
          echo "Publishing @buildstuff/jackline@${PKG}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck CLI
        run: pnpm --filter @buildstuff/jackline typecheck

      - name: Test CLI
        run: pnpm --filter @buildstuff/jackline test

      - name: Build CLI
        run: pnpm --filter @buildstuff/jackline build

      - name: OIDC preflight
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "Missing GitHub OIDC env (id-token: write not effective)."
            exit 1
          fi
          echo "GitHub OIDC request URL is present."
          # Ensure token-based auth is not preferred over OIDC.
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          rm -f "$HOME/.npmrc" .npmrc apps/cli/.npmrc || true

      - name: Publish @buildstuff/jackline
        working-directory: apps/cli
        # Build already ran; skip prepublishOnly (pnpm build) under npm.
        # Auth is OIDC from id-token: write — do not set NODE_AUTH_TOKEN (even to "").
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          npm publish --access public --ignore-scripts
