server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Zudoku prerenders *.html; also support clean paths
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|map)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
