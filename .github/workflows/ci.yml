# PR / main quality gates for humans and AI agents.
# Expand with lint (Biome), boundaries, OpenAPI/Drizzle drift as those land.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jackline
          POSTGRES_PASSWORD: jackline
          POSTGRES_DB: jackline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jackline -d jackline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Integration tests
        run: pnpm test:integration
        env:
          INTEGRATION_DATABASE_URL: postgresql://jackline:jackline@127.0.0.1:5432/jackline

  betterleaks:
    name: betterleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Official Betterleaks binary (Gitleaks successor). No license secret
      # required for private repos.
      - name: Install betterleaks
        env:
          BETTERLEAKS_VERSION: "1.8.1"
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz betterleaks
          sudo mv betterleaks /usr/local/bin/betterleaks
          betterleaks version

      # medium+ skips noisy low-confidence generic matches (docs/examples)
      # while still failing on GitHub PATs, cloud keys, etc.
      - name: Scan for secrets
        run: >
          betterleaks git .
          --config .betterleaks.toml
          --verbose
          --redact
          --confidence medium
          --no-banner
