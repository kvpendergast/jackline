# Build and push Jackline production images to GitHub Container Registry (ghcr.io).
#
# Images (per Dockerfile --target):
#   ghcr.io/<owner>/jackline-api
#   ghcr.io/<owner>/jackline-gateway
#   ghcr.io/<owner>/jackline-web
#   ghcr.io/<owner>/jackline-docs
#   ghcr.io/<owner>/jackline-migrate
#
# Triggers:
#   - push to main → tags: main, sha-<short>, latest
#   - tag v*       → tags: v1.2.3, 1.2.3, latest
#   - workflow_dispatch
#
# While this repo is private, packages default to private. For anonymous pulls,
# set each package visibility to Public in GitHub → Packages (or docker login).
# Customers can mirror to ECR/GCR/Harbor — see apps/docs/pages/self-hosting.mdx.
name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
            image: jackline-api
          - target: gateway
            image: jackline-gateway
          - target: web
            image: jackline-web
          - target: docs
            image: jackline-docs
          - target: migrate
            image: jackline-migrate
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set image name (lowercase owner)
        run: |
          set -euo pipefail
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=${{ env.REGISTRY }}/${OWNER}/${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: false
          sbom: false
