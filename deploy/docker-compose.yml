# Production-like single-host stand-up for Jackline (generic Docker happy path).
# Usage (from repo root):
#   cp .env.example .env
#   # set POSTGRES_PASSWORD, JACKLINE_MASTER_KEY, BETTER_AUTH_SECRET
#   #   openssl rand -base64 32
#   pnpm env:check   # optional — fail fast on missing env
#   docker compose -f deploy/docker-compose.yml up --build
#
# UI:      http://127.0.0.1:5173
# API:     http://127.0.0.1:8080
# Gateway: http://127.0.0.1:8081/mcp
# Docs:    http://127.0.0.1:3000
#
# Production images + Caddy (+ optional Postgres overlay):
#   deploy/compose.prod.yml [-f deploy/compose.postgres.yml]

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - jackline_pg:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
    command: ["pnpm", "db:migrate"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
    command: ["pnpm", "--filter", "@jackline/api", "dev"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_HOST: 0.0.0.0
      API_PORT: 8080
      BETTER_AUTH_URL: http://127.0.0.1:8080
      WEB_ORIGIN: http://127.0.0.1:5173
      JACKLINE_PUBLIC_MCP_URL: http://127.0.0.1:8081/mcp
      JACKLINE_INTERNAL_MCP_URL: http://gateway:8081/mcp
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
    command: ["pnpm", "--filter", "@jackline/gateway", "dev"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
    command:
      [
        "pnpm",
        "--filter",
        "@jackline/web",
        "dev",
        "--",
        "--host",
        "0.0.0.0",
        "--port",
        "5173",
      ]
    environment:
      VITE_DEV_HOST: "0.0.0.0"
      VITE_API_PROXY: http://api:8080
    ports:
      - "5173:5173"
    depends_on:
      - api

  docs:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
    # Exports OpenAPI then serves Zudoku. Prefer host networking-friendly bind.
    command: ["pnpm", "--filter", "@jackline/docs", "dev", "--", "--port", "3000"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  jackline_pg:
