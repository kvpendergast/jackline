# Production single-host stand-up for Mesh (default topology).
#
# UI + API + MCP share one origin via Caddy. Caddy is a convenience edge —
# not required (see compose.byo-edge.yml / compose.gateway-split.yml).
#
# Usage (from repo root):
#   cp deploy/.env.prod.example .env.prod
#   # set MESH_MASTER_KEY, BETTER_AUTH_SECRET
#   docker compose -f deploy/compose.prod.yml --env-file .env.prod up --build -d
#
# HTTPS: set MESH_SITE_ADDRESS / MESH_DOCS_SITE_ADDRESS to bare hostnames
# (no http://) and open ports 80 + 443. See apps/docs/pages/self-hosting.mdx.
#
# Dev (tsx watch) stack remains: deploy/docker-compose.yml + Dockerfile.dev

name: mesh

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mesh}
      POSTGRES_DB: mesh
    volumes:
      - mesh_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesh -d mesh"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrate
    env_file:
      - ../.env.prod
    environment:
      DATABASE_URL: postgresql://mesh:${POSTGRES_PASSWORD:-mesh}@postgres:5432/mesh
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    env_file:
      - ../.env.prod
    environment:
      DATABASE_URL: postgresql://mesh:${POSTGRES_PASSWORD:-mesh}@postgres:5432/mesh
      API_HOST: 0.0.0.0
      API_PORT: 8080
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: gateway
    env_file:
      - ../.env.prod
    environment:
      DATABASE_URL: postgresql://mesh:${POSTGRES_PASSWORD:-mesh}@postgres:5432/mesh
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8081
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    depends_on:
      - api
    restart: unless-stopped

  docs:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: docs
    restart: unless-stopped

  caddy:
    image: caddy:2.9-alpine
    ports:
      - "${MESH_HTTP_PORT:-80}:80"
      - "${MESH_HTTPS_PORT:-443}:443"
    environment:
      MESH_SITE_ADDRESS: ${MESH_SITE_ADDRESS:-http://localhost}
      MESH_DOCS_SITE_ADDRESS: ${MESH_DOCS_SITE_ADDRESS:-http://docs.localhost}
      MESH_CADDY_GLOBAL_OPTIONS: ${MESH_CADDY_GLOBAL_OPTIONS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - gateway
      - web
      - docs
    restart: unless-stopped

volumes:
  mesh_pg:
  caddy_data:
  caddy_config:
