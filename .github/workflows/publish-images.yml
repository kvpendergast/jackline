# Build and push Jackline production images to GitHub Container Registry (ghcr.io).
#
# Images (per Dockerfile --target):
#   ghcr.io/<owner>/jackline-api
#   ghcr.io/<owner>/jackline-gateway
#   ghcr.io/<owner>/jackline-web
#   ghcr.io/<owner>/jackline-docs
#   ghcr.io/<owner>/jackline-migrate
#
# Triggers:
#   - push to main → tags: main, sha-<short>, latest
#   - tag v*       → tags: v1.2.3, 1.2.3, latest
#   - workflow_dispatch
#
# While this repo is private, packages default to private. For anonymous pulls,
# set each package visibility to Public in GitHub → Packages (or docker login).
# Customers can mirror to ECR/GCR/Harbor — see apps/docs/pages/self-hosting.mdx.
name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
            image: jackline-api
          - target: gateway
            image: jackline-gateway
          - target: web
            image: jackline-web
          - target: docs
            image: jackline-docs
          - target: migrate
            image: jackline-migrate
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set image name (lowercase owner)
        run: |
          set -euo pipefail
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=${{ env.REGISTRY }}/${OWNER}/${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          # Fixed epoch. A commit timestamp would change every image on every
          # commit, so prod deploys could never skip an unchanged service.
          SOURCE_DATE_EPOCH: "0"
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          # push lives on this exporter together with rewrite-timestamp.
          # A separate `push: true` adds a second exporter that does not
          # rewrite file mtimes, so the published image ID would still change
          # whenever the git checkout mtime changes.
          push: false
          outputs: type=image,push=true,rewrite-timestamp=true
          tags: ${{ steps.meta.outputs.tags }}
          # metadata-action's created (build clock) and revision (git SHA)
          # labels are part of the image config and change the image ID on
          # every commit. Pin them. The real values stay on the manifest as
          # annotations, which do not affect the image ID the deploy compares.
          # provenance stays off: attestations wrap each build in a new index.
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.created=1970-01-01T00:00:00.000Z
            org.opencontainers.image.revision=reproducible-build
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            SOURCE_DATE_EPOCH=0
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: false
          sbom: false
