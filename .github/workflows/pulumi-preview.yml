# pulumi preview on pull requests (no apply, no VM SSH).
#
# Same WIF + Secret Manager prefix config as deploy-prod.yml.
# Jobs use environment: production (secrets + variables live on that Environment).
name: Pulumi preview

on:
  pull_request:
    paths:
      - "deploy/pulumi/**"
      - "deploy/compose.prod.yml"
      - "deploy/Dockerfile"
      - "deploy/Caddyfile"
      - "deploy/scripts/**"
      - ".github/workflows/pulumi-preview.yml"
      - ".github/workflows/deploy-prod.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: pulumi-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.JACKLINE_DEPLOY_PATH || 'vm' }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      JACKLINE_DOMAIN: ${{ secrets.JACKLINE_DOMAIN || vars.JACKLINE_DOMAIN }}
      JACKLINE_GIT_REPO: ${{ vars.JACKLINE_GIT_REPO }}
      JACKLINE_GIT_REF: ${{ vars.JACKLINE_GIT_REF || 'main' }}
      JACKLINE_MACHINE_TYPE: ${{ vars.JACKLINE_MACHINE_TYPE }}
      JACKLINE_VM_ZONE: ${{ vars.JACKLINE_VM_ZONE || 'us-central1-a' }}
      JACKLINE_DOCS_DOMAIN: ${{ secrets.JACKLINE_DOCS_DOMAIN || vars.JACKLINE_DOCS_DOMAIN }}
      JACKLINE_CADDY_EMAIL: ${{ secrets.JACKLINE_CADDY_EMAIL || vars.JACKLINE_CADDY_EMAIL }}
      JACKLINE_SECRET_PREFIX: ${{ vars.JACKLINE_SECRET_PREFIX || 'jackline-pulumi-' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Mask production identifiers
        run: bash "${GITHUB_WORKSPACE}/deploy/scripts/ci-mask-log-values.sh"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Pulumi CLI
        run: |
          set -euo pipefail
          curl -fsSL https://get.pulumi.com | sh -s -- --version 3.130.0
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Resolve deploy directory
        id: path
        run: |
          set -euo pipefail
          case "${DEPLOY_PATH}" in
            vm|gke) ;;
            *)
              echo "Invalid DEPLOY_PATH=${DEPLOY_PATH} (want vm or gke)"
              exit 1
              ;;
          esac
          echo "dir=deploy/pulumi/${DEPLOY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Install Pulumi program deps
        working-directory: ${{ steps.path.outputs.dir }}
        run: npm ci

      - name: Pulumi preview
        working-directory: ${{ steps.path.outputs.dir }}
        env:
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_STATE_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${PULUMI_BACKEND_URL:-}" ]; then
            echo "PULUMI_STATE_BUCKET secret is required"
            exit 1
          fi
          if [ -z "${JACKLINE_DOMAIN:-}" ]; then
            echo "JACKLINE_DOMAIN secret (or variable) is required"
            exit 1
          fi
          pulumi login "$PULUMI_BACKEND_URL"
          pulumi stack select prod --create
          bash "${GITHUB_WORKSPACE}/deploy/scripts/ci-pulumi-apply-config.sh"
          pulumi preview --suppress-outputs
