# Deploy Jackline to GCP after GHCR images are published (Pulumi + VM compose update).
#
# Triggers after "Publish images" succeeds on main (not on every push — that would
# race ahead of the image build). Manual runs via workflow_dispatch still work.
#
# Prerequisites (per-repo — not inherited by forks):
#   Secrets:
#     GCP_WORKLOAD_IDENTITY_PROVIDER
#     GCP_SERVICE_ACCOUNT
#     GCP_PROJECT_ID
#     PULUMI_STATE_BUCKET             e.g. gs://your-pulumi-state
#     PULUMI_CONFIG_PASSPHRASE        only if stack uses passphrase encryption
#   Secrets (prefer these — GitHub masks them in logs):
#     JACKLINE_DOMAIN                 required (hostname)
#     JACKLINE_DOCS_DOMAIN            optional
#     JACKLINE_CADDY_EMAIL            optional ACME contact
#     JACKLINE_VM_ZONE / JACKLINE_VM_NAME
#   Variables (plain config — change these without touching this workflow):
#     JACKLINE_DOMAIN / JACKLINE_VM_*  fallback if secret unset (leaks in logs)
#     JACKLINE_GIT_REPO               required for vm path
#     JACKLINE_GIT_REF                default main
#     JACKLINE_DEPLOY_PATH            vm (default) | gke
#     JACKLINE_SECRET_PREFIX          default jackline-pulumi-
#     GCP_REGION, JACKLINE_MACHINE_TYPE, …
#
# App/Pulumi secrets live in GCP Secret Manager as ${PREFIX}<pulumiKey>
# (e.g. jackline-pulumi-jacklineMasterKey). CI lists that prefix and
# `pulumi config set --secret` — add/rotate in GCP only.
#
# Jobs use environment: production (secrets + variables live on that Environment).
name: Deploy prod

on:
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_path:
        description: "vm or gke"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write
  packages: read
  actions: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_PATH: ${{ github.event.inputs.deploy_path || vars.JACKLINE_DEPLOY_PATH || 'vm' }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      JACKLINE_DOMAIN: ${{ secrets.JACKLINE_DOMAIN || vars.JACKLINE_DOMAIN }}
      JACKLINE_GIT_REPO: ${{ vars.JACKLINE_GIT_REPO }}
      JACKLINE_GIT_REF: ${{ vars.JACKLINE_GIT_REF || 'main' }}
      JACKLINE_MACHINE_TYPE: ${{ vars.JACKLINE_MACHINE_TYPE }}
      JACKLINE_VM_ZONE: ${{ secrets.JACKLINE_VM_ZONE || vars.JACKLINE_VM_ZONE || 'us-central1-a' }}
      JACKLINE_VM_NAME: ${{ secrets.JACKLINE_VM_NAME || vars.JACKLINE_VM_NAME || 'jackline' }}
      JACKLINE_DOCS_DOMAIN: ${{ secrets.JACKLINE_DOCS_DOMAIN || vars.JACKLINE_DOCS_DOMAIN }}
      JACKLINE_CADDY_EMAIL: ${{ secrets.JACKLINE_CADDY_EMAIL || vars.JACKLINE_CADDY_EMAIL }}
      JACKLINE_SECRET_PREFIX: ${{ vars.JACKLINE_SECRET_PREFIX || 'jackline-pulumi-' }}
      # Prefer the commit that Publish images built; fall back for manual runs.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Mask production identifiers
        run: bash "${GITHUB_WORKSPACE}/deploy/scripts/ci-mask-log-values.sh"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Pulumi CLI
        run: |
          set -euo pipefail
          curl -fsSL https://get.pulumi.com | sh -s -- --version 3.130.0
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Resolve deploy directory
        id: path
        run: |
          set -euo pipefail
          case "${DEPLOY_PATH}" in
            vm|gke) ;;
            *)
              echo "Invalid DEPLOY_PATH=${DEPLOY_PATH} (want vm or gke)"
              exit 1
              ;;
          esac
          echo "dir=deploy/pulumi/${DEPLOY_PATH}" >> "$GITHUB_OUTPUT"
          echo "Deploy path: ${DEPLOY_PATH}"

      - name: Install Pulumi program deps
        working-directory: ${{ steps.path.outputs.dir }}
        run: npm ci

      - name: Set up Docker (GKE image builds)
        if: ${{ env.DEPLOY_PATH == 'gke' }}
        uses: docker/setup-buildx-action@v4

      - name: Pulumi up
        working-directory: ${{ steps.path.outputs.dir }}
        env:
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_STATE_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${PULUMI_BACKEND_URL:-}" ]; then
            echo "PULUMI_STATE_BUCKET secret is required (e.g. gs://your-bucket)"
            exit 1
          fi
          if [ -z "${JACKLINE_DOMAIN:-}" ]; then
            echo "JACKLINE_DOMAIN secret (or variable) is required"
            exit 1
          fi
          pulumi login "$PULUMI_BACKEND_URL"
          pulumi stack select prod --create
          bash "${GITHUB_WORKSPACE}/deploy/scripts/ci-pulumi-apply-config.sh"
          pulumi up --yes --suppress-outputs

      - name: Deploy app on VM
        if: ${{ env.DEPLOY_PATH == 'vm' }}
        working-directory: ${{ steps.path.outputs.dir }}
        env:
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_STATE_BUCKET }}
        run: |
          set -euo pipefail
          export CLOUDSDK_CORE_DISABLE_PROMPTS=1

          pulumi login "$PULUMI_BACKEND_URL"
          pulumi stack select prod

          VM_NAME="$(pulumi stack output instanceName)"
          VM_ZONE="$(pulumi stack output instanceZone)"
          export JACKLINE_VM_NAME="${VM_NAME}"
          export JACKLINE_VM_ZONE="${VM_ZONE}"
          export CLOUD_SQL_PRIVATE_IP="$(pulumi stack output --show-secrets cloudSqlPrivateIp)"
          export CLOUD_SQL_CONNECTION_NAME="$(pulumi stack output --show-secrets cloudSqlConnectionName)"
          CLOUD_SQL_INSTANCE="$(pulumi stack output cloudSqlInstanceName 2>/dev/null || true)"
          export CLOUD_SQL_INSTANCE_NAME="${CLOUD_SQL_INSTANCE}"
          bash "${GITHUB_WORKSPACE}/deploy/scripts/ci-mask-log-values.sh"
          echo "VM and Cloud SQL outputs loaded"

          if [[ -n "${CLOUD_SQL_INSTANCE}" ]]; then
            CLOUD_SQL_INSTANCE_NAME="${CLOUD_SQL_INSTANCE}" \
              GIT_SHA="${DEPLOY_SHA}" \
              JACKLINE_CLOUDSQL_ON_DEMAND_KEEP="${{ vars.JACKLINE_CLOUDSQL_ON_DEMAND_KEEP || '7' }}" \
              bash "${GITHUB_WORKSPACE}/deploy/scripts/ci-cloudsql-backup.sh"
          else
            echo "Cloud SQL instance output missing — skipping on-demand backup (pre-cloud-sql stack?)"
          fi

          echo "Waiting for instance to reach RUNNING..."
          for i in $(seq 1 36); do
            status="$(gcloud compute instances describe "${VM_NAME}" \
              --project="${GCP_PROJECT_ID}" \
              --zone="${VM_ZONE}" \
              --format='value(status)' 2>/dev/null || true)"
            if [ "${status}" = "RUNNING" ]; then
              echo "Instance is RUNNING"
              break
            fi
            if [ "${i}" -eq 36 ]; then
              echo "Instance not RUNNING after 6 minutes (last status: ${status:-missing})"
              exit 1
            fi
            sleep 10
          done

          # Startup script bootstraps on first create; give it a head start before compose rebuild.
          sleep 30

          # OS Login ignores metadata SSH keys. Register an RSA key on the deploy SA profile
          # (ed25519 is not reliably accepted; auto keygen races OS Login propagation).
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          KEY="${HOME}/.ssh/google_compute_engine"
          if [[ ! -f "${KEY}" ]]; then
            ssh-keygen -q -t rsa -b 3072 -f "${KEY}" -N "" -C "github-actions-jackline-deploy"
          fi
          gcloud compute os-login ssh-keys add --key-file="${KEY}.pub" --ttl=3600 --quiet >/dev/null
          sleep 15

          # Pin images to the commit Publish images built (sha-<short> tag).
          SHORT_SHA="$(echo "${DEPLOY_SHA}" | cut -c1-7)"
          export JACKLINE_IMAGE_TAG="sha-${SHORT_SHA}"
          echo "Deploy SHA: ${DEPLOY_SHA}"
          echo "Image tag: ${JACKLINE_IMAGE_TAG}"

          # Render .env.prod on the runner from Secret Manager (never log contents).
          ENV_FILE="$(mktemp)"
          TOKEN_FILE="$(mktemp)"
          chmod 600 "${ENV_FILE}" "${TOKEN_FILE}"
          bash "${GITHUB_WORKSPACE}/deploy/scripts/ci-render-env-prod.sh" "${ENV_FILE}"
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" >"${TOKEN_FILE}"

          SCP=(gcloud compute scp
            --project="${GCP_PROJECT_ID}"
            --zone="${VM_ZONE}"
            --tunnel-through-iap
            --quiet
            --ssh-key-file="${KEY}")
          SSH=(gcloud compute ssh "${VM_NAME}"
            --project="${GCP_PROJECT_ID}"
            --zone="${VM_ZONE}"
            --tunnel-through-iap
            --quiet
            --ssh-key-file="${KEY}"
            --ssh-flag="-o StrictHostKeyChecking=no")

          # IAP tunnel (4003 failed to connect to backend) is flaky; retry
          # copies and a warmup SSH. Do not retry remote-deploy itself — a
          # failed compose roll must not be replayed blindly.
          retry_iap() {
            local n=0 max=6 delay=4
            while true; do
              if "$@"; then
                return 0
              fi
              n=$((n + 1))
              if [ "${n}" -ge "${max}" ]; then
                echo "IAP command failed after ${max} attempts" >&2
                return 1
              fi
              echo "IAP command failed (attempt ${n}/${max}); retrying in ${delay}s..."
              sleep "${delay}"
              delay=$((delay * 2))
              if [ "${delay}" -gt 32 ]; then delay=32; fi
            done
          }

          retry_iap "${SSH[@]}" --command="true"

          # Copy artifacts to the OS Login user's /tmp, then remote-deploy installs with sudo.
          retry_iap "${SCP[@]}" "${ENV_FILE}" "${VM_NAME}:/tmp/jackline.env.prod"
          retry_iap "${SCP[@]}" "${TOKEN_FILE}" "${VM_NAME}:/tmp/jackline-gh-token"
          retry_iap "${SCP[@]}" \
            "${GITHUB_WORKSPACE}/deploy/scripts/remote-deploy.sh" \
            "${VM_NAME}:/tmp/remote-deploy.sh"
          shred -u "${ENV_FILE}" "${TOKEN_FILE}" 2>/dev/null || rm -f "${ENV_FILE}" "${TOKEN_FILE}"

          "${SSH[@]}" --command="sudo \
            GIT_SHA='${DEPLOY_SHA}' \
            GIT_REPO='${JACKLINE_GIT_REPO}' \
            GIT_REF='${JACKLINE_GIT_REF:-main}' \
            ENV_PROD_SRC=/tmp/jackline.env.prod \
            GITHUB_TOKEN_FILE=/tmp/jackline-gh-token \
            bash /tmp/remote-deploy.sh"
