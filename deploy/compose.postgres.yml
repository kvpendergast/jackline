# Overlay: Postgres for generic Docker self-host (production images).
#
# Use this when you are not pointing DATABASE_URL at an external/managed
# database (Cloud SQL, RDS, etc.).
#
# From repo root:
#   cp deploy/.env.prod.example .env.prod
#   # set JACKLINE_MASTER_KEY, BETTER_AUTH_SECRET, POSTGRES_PASSWORD
#   docker compose -f deploy/compose.prod.yml -f deploy/compose.postgres.yml \
#     --env-file .env.prod pull
#   docker compose -f deploy/compose.prod.yml -f deploy/compose.postgres.yml \
#     --env-file .env.prod up -d
#
# BYO Postgres: omit this overlay and set DATABASE_URL in .env.prod instead.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jackline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-jackline}
    volumes:
      - jackline_pg:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jackline}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jackline}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jackline}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jackline}
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jackline}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jackline}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  jackline_pg:
