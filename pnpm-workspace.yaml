packages:
  - "apps/*"
  - "packages/*"

# Force patched hono everywhere (zudoku still pins 4.12.32 otherwise).
overrides:
  hono: ">=4.12.34"
  "@opentelemetry/exporter-prometheus": ">=0.217.0"
  "@opentelemetry/propagator-jaeger": ">=2.9.0"
  "@opentelemetry/core": ">=2.8.0"
  # MCP SDK / Ajv / Express transitives (Dependabot wave 3).
  fast-uri: "3.1.6"
  ip-address: ">=10.3.1"
  qs: "6.16.0"
  "js-yaml@^4.0.0": "4.3.1"
  "nanoid@^3.0.0": "3.3.18"
  "@hono/node-server@^1.0.0": "^2.0.10"
  # Docs / toolchain (Dependabot wave 4). Do not remap esbuild 0.18
  # (@esbuild-kit / drizzle-kit); that line is dismissed as Windows/dev-server only.
  "esbuild@^0.27.0": "0.28.1"
  toml: "4.2.0"

# Supply-chain hardening (see https://pnpm.io/supply-chain-security)
# Delay new versions so malicious publishes can be yanked before we resolve them.
minimumReleaseAge: 4320 # minutes (3 days)
# Refuse transitive git/tarball/URL deps; only direct deps may use exotic sources.
blockExoticSubdeps: true
# Fail if a package's trust evidence got weaker than earlier releases
# (e.g. trusted publisher → provenance-only / none).
trustPolicy: no-downgrade
# Older releases often predate trusted publishing; don't fail trust checks on them.
trustPolicyIgnoreAfter: 525600 # minutes (365 days)

# Lifecycle scripts: only explicitly allowed packages may build (pnpm v10+).
allowBuilds:
  esbuild: true
