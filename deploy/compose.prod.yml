# Production single-host stand-up for Jackline (default topology).
#
# UI + API + MCP share one origin via Caddy. Caddy is a convenience edge —
# not required (see compose.byo-edge.yml / compose.gateway-split.yml).
#
# First boot / local (from repo root):
#   cp deploy/.env.prod.example .env.prod
#   # set JACKLINE_MASTER_KEY, BETTER_AUTH_SECRET
#   docker compose -f deploy/compose.prod.yml --env-file .env.prod up --build -d
#
# Live VM updates: use deploy/scripts/remote-deploy.sh (not `up --build -d`).
# That script builds first, starts a second replica, and only removes the old
# container after Docker health is green. `up --build -d` replaces in place.
#
# HTTPS: set JACKLINE_SITE_ADDRESS / JACKLINE_DOCS_SITE_ADDRESS to bare hostnames
# (no http://) and open ports 80 + 443. See apps/docs/pages/self-hosting.mdx.
#
# Dev (tsx watch) stack remains: deploy/docker-compose.yml + Dockerfile.dev

name: jackline

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jackline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jackline}
      POSTGRES_DB: jackline
    volumes:
      - jackline_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jackline -d jackline"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrate
    env_file:
      - ../.env.prod
    environment:
      DATABASE_URL: postgresql://jackline:${POSTGRES_PASSWORD:-jackline}@postgres:5432/jackline
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    env_file:
      - ../.env.prod
    environment:
      DATABASE_URL: postgresql://jackline:${POSTGRES_PASSWORD:-jackline}@postgres:5432/jackline
      API_HOST: 0.0.0.0
      API_PORT: 8080
      NODE_ENV: production
      JACKLINE_INTERNAL_MCP_URL: http://gateway:8081/mcp
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: gateway
    env_file:
      - ../.env.prod
    environment:
      DATABASE_URL: postgresql://jackline:${POSTGRES_PASSWORD:-jackline}@postgres:5432/jackline
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8081
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  docs:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: docs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  caddy:
    image: caddy:2.9-alpine
    ports:
      - "${JACKLINE_HTTP_PORT:-80}:80"
      - "${JACKLINE_HTTPS_PORT:-443}:443"
    environment:
      JACKLINE_SITE_ADDRESS: ${JACKLINE_SITE_ADDRESS:-http://localhost}
      JACKLINE_DOCS_SITE_ADDRESS: ${JACKLINE_DOCS_SITE_ADDRESS:-http://docs.localhost}
      JACKLINE_CADDY_GLOBAL_OPTIONS: ${JACKLINE_CADDY_GLOBAL_OPTIONS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - gateway
      - web
      - docs
    restart: unless-stopped

volumes:
  jackline_pg:
  caddy_data:
  caddy_config:
