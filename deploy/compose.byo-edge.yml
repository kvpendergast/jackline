# Overlay: no Jackline-managed edge proxy. Publish api / gateway / web / docs ports
# and put your own reverse proxy (nginx, Traefik, cloud LB, etc.) in front.
#
# Usage (from repo root):
#   docker compose -f deploy/compose.prod.yml -f deploy/compose.byo-edge.yml \
#     --env-file .env.prod up --build -d
#
# Caddy is disabled via a Compose profile that is not enabled by default.
#
# Set public URLs to whatever your edge exposes, for example:
#   WEB_ORIGIN=https://jackline.example.com
#   BETTER_AUTH_URL=https://jackline.example.com
#   JACKLINE_PUBLIC_API_URL=https://jackline.example.com
#   JACKLINE_PUBLIC_MCP_URL=https://mcp.example.com/mcp
#
# Split UI and API hosts: set WEB_ORIGIN to the UI origin and
# JACKLINE_ADDITIONAL_ORIGINS if you need extras; BETTER_AUTH_URL /
# JACKLINE_PUBLIC_API_URL to the API origin.

services:
  api:
    ports:
      - "${JACKLINE_API_PUBLISH_PORT:-8080}:8080"

  gateway:
    ports:
      - "${JACKLINE_GATEWAY_PUBLISH_PORT:-8081}:8081"

  web:
    ports:
      - "${JACKLINE_WEB_PUBLISH_PORT:-8088}:80"

  docs:
    ports:
      - "${JACKLINE_DOCS_PUBLISH_PORT:-8089}:80"

  caddy:
    # Merged service only starts when --profile caddy-edge is passed.
    profiles: ["caddy-edge"]
